[package]
name = "app"
version = "2.1.1"
description = "OAZE — gestão e inteligência financeira pessoal"
authors = ["OAZE"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0" }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# cofre do sistema: Credential Manager no Windows, Keychain no macOS
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["time"] }

# Windows Hello
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }

# Touch ID
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext"] }
block2 = "0.6"

[profile.release]
# app de finanças não precisa de símbolo no binário publicado, e o instalador
# fica menor — o que importa na Microsoft Store e no DMG
strip = true
lto = true
codegen-units = 1
panic = "abort"
