<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1821" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <!--
      A CSP trava de onde o app pode carregar e para onde pode enviar. Num painel
      financeiro isso importa: mesmo que algo malicioso rodasse na página, não
      conseguiria mandar os dados para um domínio qualquer.

      `api.openai.com` NÃO está aqui, e é de propósito: quem fala com o modelo é a
      Edge Function `oaze-assistant`, que é `*.supabase.co`. A chave nunca passa
      pelo navegador — liberar o domínio seria manter aberta uma porta que
      ninguém usa.

      `frame-ancestors` saiu daqui: em <meta> o navegador ignora a diretiva e
      ainda reclama no console. Ela vale só como cabeçalho HTTP, e está no
      `.htaccess` da Hostinger (e no `tauri.conf.json`, para o desktop).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <link rel="icon" type="image/svg+xml" href="./brand/oaze-favicon.svg" />
    <title>OAZE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
