# Verifica o núcleo do app a cada mudança: tipos, testes do motor e build web.
# Nenhuma loja recebe um binário que não passou por aqui.
name: App · verificação

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ci.yml']
  pull_request:
    paths: ['app/**']
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node tools/test-coco-import.mjs
      - run: node tools/test-invest-market.mjs
      - run: node tools/test-invest-daily.cjs
      - run: npm run build
      - run: npm run build:published
      # Varre segredo no código e no pacote, e confere que a CSP cobre o que o
      # app realmente chama. Um domínio faltando na CSP não dá erro em lugar
      # nenhum: o navegador recusa calado, só em produção.
      - run: npm run verificar:seguranca
      - name: Confere o painel distribuído
        run: |
          test -s dist-live/index.html
          test -s dist-live/entrar.html
          test -s dist-live/native/bridge.js
          test -s dist-live/assets/app/app.js
      # O script principal do painel publicado tem teto próprio.
      - name: Peso do primeiro carregamento
        run: |
          set -euo pipefail
          bytes=$(gzip -c dist-live/assets/app/app.js | wc -c)
          limite=$((184 * 1024))
          echo "JS principal do painel: $((bytes / 1024)) KB comprimidos (teto $((limite / 1024)) KB)"
          if [ "$bytes" -gt "$limite" ]; then
            echo "::error::o pacote principal passou do teto"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: published-dist
          path: app/dist-live
          retention-days: 7
