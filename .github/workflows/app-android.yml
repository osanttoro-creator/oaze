# Google Play: gera o AAB assinado com a chave de upload.
# Segredos (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_B64      keystore de upload em base64
#   ANDROID_KEYSTORE_PASSWORD senha do keystore
#   ANDROID_KEY_ALIAS         alias da chave
#   ANDROID_KEY_PASSWORD      senha da chave
# O envio ao Play Console fica manual até o app existir lá (primeiro envio é sempre manual).
name: App · Android (Google Play)

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'teste = AAB para canal de testes do Play (sincronização pode estar desligada); producao = exige sincronização validada'
        type: choice
        options: [teste, producao]
        default: teste
  push:
    tags: ["app-v*"]

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  aab:
    needs: verifica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: ${{ vars.OAZE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OAZE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OAZE_ENV: production
      VITE_OAZE_DISTRIBUTION: play
      VITE_OAZE_SYNC_ENABLED: ${{ vars.OAZE_SYNC_ENABLED }}
      CANAL: ${{ inputs.canal || 'producao' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O painel publicado exige conta. O canal de testes tolera a flag antiga
      # de sincronização desligada, mas isso não libera uso sem login.
      # Produção exige teste real da conta em dois aparelhos.
      - name: Confere o que o canal exige
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure OAZE_SUPABASE_URL e OAZE_SUPABASE_PUBLISHABLE_KEY nas variáveis do repositório."
            exit 1
          fi
          if [ "$CANAL" = producao ] && [ "$VITE_OAZE_SYNC_ENABLED" != true ]; then
            echo "::error::Canal de produção exige OAZE_SYNC_ENABLED=true, depois do teste real entre dois aparelhos. Use o canal 'teste' enquanto isso."
            exit 1
          fi
          echo "canal: $CANAL · sincronização: ${VITE_OAZE_SYNC_ENABLED:-false}"

      - run: npm ci
      - run: npm run build:published
      - run: npm run verificar:seguranca
      - run: npx cap sync android

      - name: Chave de upload
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 não está configurado"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Gera o AAB
        working-directory: app/android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PoazeVersionCode=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Apaga a chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: oaze-android-aab-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
