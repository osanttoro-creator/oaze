# Pacote de teste Android. O projeto iOS permanece no repositório, fora desta rodada.
name: App · Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-test.yml"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-mobile-test.yml"

permissions:
  contents: read

concurrency:
  group: mobile-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  android:
    needs: verifica
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: ${{ vars.OAZE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OAZE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OAZE_ENV: staging
      VITE_OAZE_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verifica configuração da conta
        shell: bash
        run: |
          if { [ -n "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; } ||
             { [ -z "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; }; then
            echo "::error::Configure as duas variáveis públicas OAZE_SUPABASE_URL e OAZE_SUPABASE_PUBLISHABLE_KEY, ou nenhuma para testar só offline."
            exit 1
          fi
      - run: npm ci
      - run: npm run build:published
      - run: npm run verificar:seguranca
      - run: npx cap sync android
      - name: Gera APK de teste
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PoazeVersionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: github.head_ref != 'codex/oaze-multiplatform-foundation'
        with:
          name: oaze-android-teste-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Disponibiliza APK em release de teste
        if: github.head_ref == 'codex/oaze-multiplatform-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="app-v${version}-android-test"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --draft --prerelease --target "$RELEASE_SHA" --title "OAZE ${version} Android - teste" --notes "APK de teste da versão ${version}. Ainda não é pacote assinado para Google Play."
          fi
          echo "Release rascunho: $tag"
      - name: Verifica AAB sem assinatura de loja
        working-directory: app/android
        run: ./gradlew --no-daemon bundleRelease -PoazeVersionCode=${{ github.run_number }}
