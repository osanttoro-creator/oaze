# Microsoft Store: gera o pacote MSIX para enviar pelo Partner Center.
#
# Por que MSIX e não o MSI/EXE que o Tauri já produz: no caminho empacotado a
# Microsoft assina o pacote e hospeda o binário sem custo; no caminho
# "instalador como está" o editor precisa comprar certificado de uma CA do
# programa de raízes confiáveis e hospedar o arquivo numa URL estável.
# Comparação: https://learn.microsoft.com/en-us/windows/apps/distribute-through-store/how-to-distribute-your-win32-app-through-microsoft-store
#
# Variáveis do repositório (Settings → Secrets and variables → Actions → Variables).
# Os três valores de identidade são atribuídos pelo Partner Center ao produto —
# não são escolha nossa, e o Partner Center compara o manifesto caractere por
# caractere:
#   MSSTORE_IDENTITY_NAME           ex.: 12345Editor.OAZE
#   MSSTORE_IDENTITY_PUBLISHER      ex.: CN=AAAAAAAA-1111-2222-3333-BBBBBBBBBBBB
#   MSSTORE_PUBLISHER_DISPLAY_NAME  o nome jurídico do editor, como aparece lá
#
# O pacote sai sem assinatura de propósito. Isso é o esperado para envio pela
# Store, e também significa que ele não instala nesta máquina sem um
# certificado de teste confiado localmente.
name: App · Windows (Microsoft Store)

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'teste = pacote para o canal de testes da Store (sincronização pode estar desligada); producao = exige sincronização validada'
        type: choice
        options: [teste, producao]
        default: teste
  # A mesma tag que dispara o AAB do Play: uma publicação, os dois pacotes.
  push:
    tags: ['app-v*']

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  msix:
    needs: verifica
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      VITE_SUPABASE_URL: ${{ vars.OAZE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OAZE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OAZE_ENV: production
      VITE_OAZE_SYNC_ENABLED: ${{ vars.OAZE_SYNC_ENABLED }}
      CANAL: ${{ inputs.canal || 'producao' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Um pacote de loja sem conta configurada seria um app que não deixa
      # ninguém entrar. Já a sincronização pode ficar desligada no canal de
      # testes: sem conta o app funciona inteiro, isolado no aparelho — isso é
      # promessa do produto. Para produção ela precisa ter sido validada entre
      # dois aparelhos (docs/12-PUBLICACAO.md).
      - name: Confere o que o canal exige
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure OAZE_SUPABASE_URL e OAZE_SUPABASE_PUBLISHABLE_KEY nas variáveis do repositório."
            exit 1
          fi
          if [ "$CANAL" = producao ] && [ "$VITE_OAZE_SYNC_ENABLED" != true ]; then
            echo "::error::Canal de produção exige OAZE_SYNC_ENABLED=true, depois do teste real entre dois aparelhos. Use o canal 'teste' enquanto isso."
            exit 1
          fi
          echo "canal: $CANAL · sincronização: ${VITE_OAZE_SYNC_ENABLED:-false}"

      - run: npm ci
      # --no-bundle: o MSIX não usa instalador. O MSI/EXE do Tauri é o outro
      # caminho de distribuição e sai do workflow "App · Windows".
      - run: npx tauri build --no-bundle

      - name: Empacota MSIX
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_IDENTITY_PUBLISHER: ${{ vars.MSSTORE_IDENTITY_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: node tools/empacotar-msix.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: oaze-msix-${{ github.run_number }}
          path: app/src-tauri/target/msix/*.msix
          if-no-files-found: error
          retention-days: 30
