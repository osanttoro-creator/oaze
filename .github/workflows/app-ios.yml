# App Store (iPhone). Só roda em macOS: esta é a única forma de gerar o app sem um Mac próprio.
#
# Sem segredos: compila sem assinatura, para provar que o projeto fecha.
# Com segredos: arquiva, assina pela conta de desenvolvedor (assinatura automática)
# e envia ao App Store Connect. A validar no primeiro envio real.
#   APPLE_TEAM_ID               ID do time
#   ASC_KEY_ID / ASC_ISSUER_ID  chave de API do App Store Connect
#   ASC_KEY_P8                  conteúdo do arquivo .p8
name: App · iOS (App Store)

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  ios:
    needs: verifica
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # segredo não pode ir direto num if; vira um sim/não aqui
      ASSINAR: ${{ secrets.ASC_KEY_ID != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Compila sem assinatura
        if: env.ASSINAR != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Arquiva, assina e envia
        if: env.ASSINAR == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OAZE.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OAZE.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
