# Candidato de produção Windows. O projeto macOS permanece fora desta rodada.
#
# Windows: gera MSI e instalador NSIS. A Store aceita MSI/EXE assinados com certificado
# de código, ou MSIX — a escolha está em docs/02-TRD.md.
name: App · Windows

# 12/11/2026: sem gatilho em pull_request. O repositório é privado e os
# 2.000 minutos grátis do mês acabaram em 5/11, quase todos em compilações
# repetidas a cada atualização do PR. Rodar à mão (Run workflow) ou pela tag.
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  desktop:
    needs: verifica
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ vars.OAZE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OAZE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OAZE_ENV: production
      VITE_OAZE_SYNC_ENABLED: "true"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Verifica configuração da conta
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure as duas variáveis públicas OAZE_SUPABASE_URL e OAZE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        if: github.head_ref != 'codex/oaze-multiplatform-foundation'
        with:
          name: oaze-windows-teste-${{ github.run_number }}
          path: |
            app/src-tauri/target/release/app.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
      - name: Disponibiliza instaladores em release de teste
        if: github.head_ref == 'codex/oaze-multiplatform-foundation'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "app-v${version}-windows-rc"
          $assets = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File -ErrorAction SilentlyContinue
            Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File -ErrorAction SilentlyContinue
          ) | ForEach-Object FullName
          if (-not $assets -or $assets.Count -eq 0) { throw 'Instaladores Windows não encontrados.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --prerelease --target $env:RELEASE_SHA --title "OAZE $version Windows - candidato" --notes "Build de produção do Windows. Requer teste instalado antes do lançamento; instaladores EXE/MSI não são assinados para a Microsoft Store."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao disponibilizar instaladores Windows.' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a prévia Windows.' }
          Write-Host "Prévia publicada: $tag"
