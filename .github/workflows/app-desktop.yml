# Pacote de teste Windows. O projeto macOS permanece no repositório, fora desta rodada.
#
# Windows: gera MSI e instalador NSIS. A Store aceita MSI/EXE assinados com certificado
# de código, ou MSIX — a escolha está em docs/02-TRD.md.
name: App · Windows

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-desktop.yml'

jobs:
  verifica:
    uses: ./.github/workflows/app-ci.yml

  desktop:
    needs: verifica
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ vars.OAZE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.OAZE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OAZE_ENV: staging
      VITE_OAZE_SYNC_ENABLED: "false"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Verifica configuração da conta
        shell: bash
        run: |
          if { [ -n "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; } ||
             { [ -z "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; }; then
            echo "::error::Configure as duas variáveis públicas OAZE_SUPABASE_URL e OAZE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: oaze-windows-teste-${{ github.run_number }}
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
